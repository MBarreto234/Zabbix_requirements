### Servidor Syslog (rsyslog) - VLAN 83
services:
  syslog:
    image: francopro/syslog-vlan83@sha256:fcd987539db665611b525311dbde96ccb8b7d32761999f80e0ac4d20f14a5d56   # tag 1.0
    container_name: syslog-server
    restart: unless-stopped
    ports:
      - "514:514/udp"
    volumes:
      - ./logs:/var/log
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID]
    security_opt:
      - no-new-privileges:true

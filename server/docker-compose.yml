### Zabbix Server + PostgreSQL + Frontend (para la PC Windows / host central)
### Uso: copiar .env.example a .env, editar la contraseña y ejecutar
###   docker compose up -d
### Frontend: http://localhost  (Admin / zabbix -> cambiar al primer ingreso)

services:
  postgres-server:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=zabbix
      - POSTGRES_USER=zabbix
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.0-latest
    ports:
      - "10051:10051"
    environment:
      - DB_SERVER_HOST=postgres-server
      - POSTGRES_DB=zabbix
      - POSTGRES_USER=zabbix
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      - postgres-server
    restart: unless-stopped

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0-latest
    ports:
      - "${WEB_PORT:-80}:8080"
    environment:
      - DB_SERVER_HOST=postgres-server
      - POSTGRES_DB=zabbix
      - POSTGRES_USER=zabbix
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - ZBX_SERVER_HOST=zabbix-server
    depends_on:
      - postgres-server
      - zabbix-server
    restart: unless-stopped

volumes:
  pgdata:
